problem:
  type: integro_differential
  alpha: 0.5
  beta: 0.5
  x_min: 0.0
  x_max: 1.0
  t_max: 1.0
  mesh_grading: 2.0
  solution:
    family: cosine
    spatial_frequency: 1.0
    time_power: 0.5
    amplitude: 1.0
    phase: 0.0
discretization:
  N_x: 8
  N_t: 8
  N_collocation: 8
  N_boundary: 4
  N_initial: 4
  N_integral_quad: 4
network:
  model_type: te_qpinn_pennylane
  input_dim: 2
  output_dim: 1
  hidden_layers:
  - 16
  - 16
  activation: tanh
  te_qpinn_pennylane:
    num_qubits: 4
    num_layers: 5
    entanglement: chain
    readout_type: z_sum
    embedding_hidden_layers:
    - 10
    - 10
    embedding_activation: tanh
    input_mins:
    - 0.0
    - 0.0
    input_maxs:
    - 1.0
    - 1.0
    rescale_min: -1.0
    rescale_max: 1.0
training:
  epochs: 2
  learning_rate: 0.0005
  scheduler:
    enabled: false
    type: cosine_warmup
    warmup_epochs: 1
    min_lr: 1.0e-05
  lbfgs:
    enabled: false
    epochs: 0
    lr: 1.0
    max_iter: 20
    history_size: 50
  weights:
    pde: 1.0
    bc: 20.0
    ic: 20.0
logging:
  eval_interval: 1
  checkpoint_interval: 100
  track_points: false
  points_file: outputs/benchmarks/te_qpinn_exact_pqc_smoke/unused_points.csv
  track_l1_points: false
  l1_points_file: outputs/benchmarks/te_qpinn_exact_pqc_smoke/unused_l1_points.csv
reproducibility:
  deterministic_torch: true
  deterministic_sampling: true
  fixed_collocation: false
  data_seed: 42
paths:
  checkpoint_dir: outputs/benchmarks/te_qpinn_exact_pqc_smoke/seed_42/te_qpinn_exact_pennylane_pi_tiny/checkpoints
  results_dir: outputs/benchmarks/te_qpinn_exact_pqc_smoke/seed_42/te_qpinn_exact_pennylane_pi_tiny/artifacts
device: cpu
seed: 42
