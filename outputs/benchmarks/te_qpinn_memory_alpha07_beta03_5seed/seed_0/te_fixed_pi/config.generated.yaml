problem:
  type: integro_differential
  alpha: 0.7
  beta: 0.3
  x_min: 0.0
  x_max: 1.0
  t_max: 1.0
  mesh_grading: 2.0
  solution:
    family: cosine
    spatial_frequency: 1.0
    time_power: 0.7
    amplitude: 1.0
    phase: 0.0
discretization:
  N_x: 50
  N_t: 50
  N_collocation: 32
  N_boundary: 16
  N_initial: 16
  N_integral_quad: 10
network:
  model_type: te_qpinn_surrogate
  input_dim: 2
  output_dim: 1
  hidden_layers:
  - 32
  - 32
  - 32
  activation: tanh
  te_qpinn:
    n_qubits: 8
    embedding_hidden_layers:
    - 24
    - 20
    - 20
    embedding_activation: tanh
    input_mins:
    - 0.0
    - 0.0
    input_maxs:
    - 1.0
    - 1.0
    rescale_min: -0.95
    rescale_max: 0.95
    use_pairwise_entanglement: true
    variational_hidden_dim: 32
    variational_activation: tanh
    expectation_activation: tanh
    residual_connection: true
    residual_hidden_dim: 8
    residual_activation: tanh
    residual_scale: 0.1
training:
  epochs: 12
  learning_rate: 0.001
  scheduler:
    enabled: false
    type: cosine_warmup
    warmup_epochs: 1
    min_lr: 1.0e-05
  lbfgs:
    enabled: false
    epochs: 0
    lr: 1.0
    max_iter: 20
    history_size: 50
  weights:
    pde: 1.0
    bc: 20.0
    ic: 20.0
logging:
  eval_interval: 1
  checkpoint_interval: 1000
  track_points: false
  points_file: outputs/benchmarks/te_qpinn_memory_alpha07_beta03_5seed/unused_points.csv
  track_l1_points: false
  l1_points_file: outputs/benchmarks/te_qpinn_memory_alpha07_beta03_5seed/unused_l1_points.csv
reproducibility:
  deterministic_torch: true
  deterministic_sampling: true
  fixed_collocation: false
  data_seed: 0
paths:
  checkpoint_dir: outputs/benchmarks/te_qpinn_memory_alpha07_beta03_5seed/seed_0/te_fixed_pi/checkpoints
  results_dir: outputs/benchmarks/te_qpinn_memory_alpha07_beta03_5seed/seed_0/te_fixed_pi/artifacts
device: cuda
seed: 0
