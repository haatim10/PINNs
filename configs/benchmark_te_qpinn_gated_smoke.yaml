# Phase 7B smoke benchmark plan: classical vs TE fixed vs TE gated (seed 42)

seeds: [42]
device: auto
output_dir: outputs/benchmarks/te_qpinn_gated_smoke
plots_dir: outputs/plots/te_qpinn_gated_smoke
report_name: benchmark_report.md

runs:
  - name: classical_pi
    label: Classical + PI
    config: configs/benchmark_te_qpinn_50_classical_pi.yaml
  - name: full_te_pi
    label: TE-QPINN Fixed Residual 0.10 + PI
    config: configs/benchmark_te_qpinn_50_surrogate_pi.yaml
  - name: gated_te_pi
    label: TE-QPINN Gated Residual + PI
    config: configs/benchmark_te_qpinn_50_surrogate_pi_gated.yaml
