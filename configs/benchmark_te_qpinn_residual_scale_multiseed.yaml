# Phase 6F: targeted residual-scale multi-seed validation (locked 50x50 setup)

seeds: [0, 1, 2, 3, 4]
device: auto
output_dir: outputs/benchmarks/te_qpinn_residual_scale_multiseed
plots_dir: outputs/plots/te_qpinn_residual_scale_multiseed
report_name: benchmark_report.md

runs:
  - name: classical_pi
    label: Classical + PI
    config: configs/benchmark_te_qpinn_50_classical_pi.yaml
  - name: full_te_pi
    label: Full TE-QPINN + PI (residual 0.10)
    config: configs/benchmark_te_qpinn_50_surrogate_pi.yaml
  - name: residual_scale_020_pi
    label: TE-QPINN + PI (residual 0.20)
    config: configs/benchmark_te_qpinn_ablation_residual_scale_020_pi.yaml
