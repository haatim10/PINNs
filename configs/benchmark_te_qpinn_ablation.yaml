# TE-QPINN ablation study plan (seed-42 smoke)

seeds: [42]
device: auto
output_dir: outputs/benchmarks/te_qpinn_ablation
plots_dir: outputs/plots/te_qpinn_ablation
report_name: benchmark_report.md

runs:
  - name: classical_pi
    label: Classical + PI
    config: configs/benchmark_te_qpinn_ablation_classical_pi.yaml
  - name: full_te_pi
    label: Full TE-QPINN + PI
    config: configs/benchmark_te_qpinn_ablation_full_te_pi.yaml
  - name: no_residual_pi
    label: TE no residual + PI
    config: configs/benchmark_te_qpinn_ablation_no_residual_pi.yaml
  - name: residual_scale_005_pi
    label: TE residual scale 0.05 + PI
    config: configs/benchmark_te_qpinn_ablation_residual_scale_005_pi.yaml
  - name: residual_scale_020_pi
    label: TE residual scale 0.20 + PI
    config: configs/benchmark_te_qpinn_ablation_residual_scale_020_pi.yaml
  - name: var_hidden_16_pi
    label: TE variational hidden 16 + PI
    config: configs/benchmark_te_qpinn_ablation_var_hidden_16_pi.yaml
  - name: var_hidden_64_pi
    label: TE variational hidden 64 + PI
    config: configs/benchmark_te_qpinn_ablation_var_hidden_64_pi.yaml
  - name: small_embedding_pi
    label: TE small embedding + PI
    config: configs/benchmark_te_qpinn_ablation_small_embedding_pi.yaml
  - name: large_embedding_pi
    label: TE large embedding + PI
    config: configs/benchmark_te_qpinn_ablation_large_embedding_pi.yaml

