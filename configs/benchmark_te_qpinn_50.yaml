# TE-QPINN Phase 3 50x50 benchmark plan (config-driven, no CLI overrides)

seeds: [42]
device: auto
output_dir: outputs/benchmarks/te_qpinn_50
plots_dir: outputs/plots/te_qpinn_50
report_name: benchmark_report.md

runs:
  - name: classical_pi
    label: Classical + PI
    config: configs/benchmark_te_qpinn_50_classical_pi.yaml
  - name: te_qpinn_surrogate_pi
    label: TE-QPINN Surrogate + PI
    config: configs/benchmark_te_qpinn_50_surrogate_pi.yaml
